{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-wrap container">
  <div class="auth-card">
    <p class="eyebrow">Welcome back</p><h1>Log in to ResumeLens</h1>
    <p class="muted">Your saved analyses are private to your account.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required>
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10-2.5A2.5 2.5 0 1 1 12 14.5a2.5 2.5 0 0 1 0-5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
      <div class="auth-row">
        <a class="text-link" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
      </div>
      <button class="button button-primary button-full" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
