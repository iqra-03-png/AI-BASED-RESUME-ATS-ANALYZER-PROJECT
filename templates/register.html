{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-wrap container">
  <div class="auth-card">
    <p class="eyebrow">Get started</p><h1>Create your account</h1>
    <p class="muted">Save your analysis history securely under your account.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required>
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10-2.5A2.5 2.5 0 1 1 12 14.5a2.5 2.5 0 0 1 0-5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
      <p class="field-help">Use at least 10 characters.</p>
      <button class="button button-primary button-full" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
