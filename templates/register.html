{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-wrap container">
  <div class="auth-card">
    <p class="eyebrow">Get started</p><h1>Create your account</h1>
    <p class="muted">Save your analysis history securely under your account.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      <p class="field-help">Use at least 10 characters.</p>
      <button class="button button-primary button-full" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
